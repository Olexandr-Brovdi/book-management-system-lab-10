[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "book-catalog"
version = "1.0.0"
description = "Lab 10 variant 2 production book catalog REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.0,<3", "numpy>=2.0,<3", "PyYAML>=6.0", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "fastapi>=0.115,<1", "starlette>=0.46,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]
authors = [{name = "Бровді Олександр"}]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/Olexandr-Brovdi/book-management-system-lab-10"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "build>=1.2", "twine>=6"]
report = ["python-docx>=1.1", "Pillow>=10", "matplotlib>=3.9"]

[project.scripts]
book-catalog = "book_catalog.runtime:main"
book-export = "book_catalog.main:main"
book-library = "book_catalog.persistence.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=book_catalog --cov-branch --cov-report=term-missing --cov-report=html --cov-report=json --cov-report=xml --cov-fail-under=85"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real file and application integration", "unit: isolated component behavior"]

[tool.coverage.run]
branch = true
source = ["book_catalog"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["^if __name__ == .__main__.:", '^ *\.\.\.$']

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["Lab_10", ".wheel-check", "build"]


[tool.setuptools.package-data]
book_catalog = ["swagger_assets/*", "migration_assets/*", "migration_assets/versions/*"]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migration_assets/"]
